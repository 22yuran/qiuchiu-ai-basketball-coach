      <div data-node-id="97:14737" data-name="Title" style="position:absolute;left:20px;top:101.5px;width:362px;height:78px;color:rgba(0,0,0,0.9);font-family:'PingFang SC';font-weight:500;font-size:26px;line-height:150%;white-space:pre-wrap;overflow-wrap:break-word">你这次的训练场地在哪？场地不同，拍摄角度也不同。</div>

    </div>
    <script>
      (() => {
        const button = document.querySelector('[data-node-id="97:14770"]');
        const card = document.querySelector('[data-node-id="97:14742"]');
        const message = document.querySelector('[data-node-id="97:14737"]');
        let leaving = false;
        button.setAttribute('role', 'button');
        button.tabIndex = 0;
        button.style.cursor = 'pointer';
        async function next() {
          if (leaving) return;
          leaving = true;
          button.setAttribute('aria-disabled', 'true');
          card.inert = true;
          card.getAnimations().forEach(animation => animation.finish());
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            await Promise.all([
              message.animate([{transform:'translateY(0)',opacity:1},
                {transform:'translateY(-24px)',opacity:0}],
                {duration:220,easing:'cubic-bezier(0.3,0,1,1)',fill:'forwards'}).finished,
              card.animate([{transform:'translateY(0)',opacity:1},
                {transform:'translateY(48px)',opacity:0}],
                {duration:280,easing:'cubic-bezier(0.3,0,1,1)',fill:'forwards'}).finished
            ]);
          }
          if (window.parent !== window) {
            window.parent.postMessage({namespace:'qiuchiu-flow',type:'navigate',target:'spot'},'*');
          } else {
            location.href = './collect-spot.html';
          }
        }
        button.addEventListener('click', next);
        button.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault(); next();
          }
        });
        const previousButton = document.querySelector('[data-node-id="97:14768"]');
        previousButton.setAttribute('role','button');
        previousButton.tabIndex = 0;
        previousButton.style.cursor = 'pointer';
        const previous = () => {
          if (window.parent !== window) {
            window.parent.postMessage({namespace:'qiuchiu-flow',type:'back'},'*');
          } else {
            location.href = './collect-hand.html';
          }
        };
        previousButton.addEventListener('click',previous);
        previousButton.addEventListener('keydown',event=>{
          if(event.key === 'Enter' || event.key === ' '){event.preventDefault();previous();}
        });
      })();
      (() => {
        const options = ['97:14748','97:14755','97:14761'].map(id =>
          document.querySelector('[data-node-id="'+id+'"]'));
        const labels = ['3X3 标准场','NBA 标准场','FIFA 标准场'];
        const selectedIcon = options[0].querySelector('img').src;
        const unselectedIcon = options[1].querySelector('img').src;
        const group = document.querySelector('[data-node-id="97:14747"]');
        group.setAttribute('role','radiogroup');
        group.setAttribute('aria-label','训练场地');
        function select(index, notify = true) {
          options.forEach((option,optionIndex) => {
            const selected = optionIndex === index;
            option.setAttribute('aria-checked',String(selected));
            option.tabIndex = selected ? 0 : -1;
            option.querySelector('img').src = selected ? selectedIcon : unselectedIcon;
          });
          group.dataset.value = labels[index];
          if (notify && window.parent !== window) {
            window.parent.postMessage({
              namespace:'qiuchiu-flow',
              type:'state',
              state:{venue:labels[index]}
            },'*');
          }
        }
        options.forEach((option,index) => {
          option.setAttribute('role','radio');
          option.setAttribute('aria-label',labels[index]);
          option.style.cursor = 'pointer';
          option.addEventListener('click',()=>select(index));
          option.addEventListener('keydown',event=>{
            if(event.key === 'Enter' || event.key === ' '){
              event.preventDefault();
              select(index);
            }
          });
        });
        // Keep the visual default local; the shell hydrates the latest choice
        // immediately after this page loads.
        select(1, false);
        window.addEventListener('message', event => {
          if (window.parent !== window && event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.namespace !== 'qiuchiu-flow' || message.type !== 'hydrate') return;
          const venue = message.state && message.state.venue;
          const index = labels.indexOf(venue);
          if (index >= 0) select(index, false);
        });
      })();
      (async () => {
        const message = document.querySelector('[data-node-id="97:14737"]');
        const card = document.querySelector('[data-node-id="97:14742"]');
        const fullText = message.textContent;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          message.style.visibility = card.style.visibility = 'visible';
          return;
        }
        message.setAttribute('aria-label', fullText);
        const text = document.createElement('span');
        text.setAttribute('aria-hidden', 'true');
        message.replaceChildren(text);
        message.style.visibility = 'visible';
        const characters = Array.from(fullText);
        const startAt = performance.now() + 80;
        await new Promise(resolve => {
          function tick(now) {
            const count = Math.min(characters.length, Math.max(0,
              Math.floor((now - startAt) / 50) + 1));
            text.textContent = characters.slice(0, count).join('');
            if (count < characters.length) requestAnimationFrame(tick);
            else resolve();
          }
          requestAnimationFrame(tick);
        });
        await new Promise(resolve => setTimeout(resolve, 100));
        card.style.visibility = 'visible';
        await card.animate([
          {transform:'translateY(48px)',opacity:0,offset:0},
          {transform:'translateY(-3px)',opacity:1,offset:0.78},
          {transform:'translateY(0)',opacity:1,offset:1}
        ], {duration:380,easing:'cubic-bezier(0.2,0,0,1)'}).finished;
      })();
      (function () {
        var DESIGN_W = 402;
        var DESIGN_H = 874;
        var stage = document.getElementById("rawStage");
        var frame = document.getElementById("rawStageFrame");
        function applyScale() {
          var viewportW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var fillViewport = DESIGN_W >= 960;
          var k = fillViewport ? viewportW / DESIGN_W : Math.min((viewportW - 32) / DESIGN_W, 1);
          if (!(k > 0)) { k = 1; }
          stage.style.transform = "scale(" + k + ")";
          frame.style.width = DESIGN_W * k + "px";
          frame.style.height = DESIGN_H * k + "px";
        }
        window.addEventListener("resize", applyScale);
        applyScale();
      })();
    </script>
