    <script>
      (() => {
        const node = id => document.querySelector(`[data-node-id="${id}"]`);
        const button = node('98:14892'), card = node('98:14867'), message = node('98:14862');
        let leaving = false;
        async function next() {
          if (leaving || button.getAttribute('aria-disabled') !== 'false') return;
          leaving = true;
          card.inert = true;
          button.setAttribute('aria-disabled', 'true');
          card.getAnimations().forEach(animation => animation.finish());
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            await Promise.all([
              message.animate([{transform:'translateY(0)',opacity:1},
                {transform:'translateY(-24px)',opacity:0}],
                {duration:220,easing:'cubic-bezier(0.3,0,1,1)',fill:'forwards'}).finished,
              card.animate([{transform:'translateY(0)',opacity:1},
                {transform:'translateY(48px)',opacity:0}],
                {duration:280,easing:'cubic-bezier(0.3,0,1,1)',fill:'forwards'}).finished
            ]);
          }
          if (window.parent !== window) {
            window.parent.postMessage({namespace:'qiuchiu-flow',type:'navigate',target:'summary'},'*');
          } else {
            location.href = './collect-summary.html';
          }
        }
        button.addEventListener('click', next);
        button.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault(); next();
          }
        });
        const previousButton = node('98:14890');
        previousButton.setAttribute('role','button');
        previousButton.tabIndex = 0;
        previousButton.style.cursor = 'pointer';
        const previous = () => {
          if (window.parent !== window) {
            window.parent.postMessage({namespace:'qiuchiu-flow',type:'back'},'*');
          } else {
            location.href = './collect-court.html';
          }
        };
        previousButton.addEventListener('click',previous);
        previousButton.addEventListener('keydown',event=>{
          if(event.key === 'Enter' || event.key === ' '){event.preventDefault();previous();}
        });
      })();
      (() => {
        const node = id => document.querySelector(`[data-node-id="${id}"]`);
        const court = node('98:14900');
        const dots = [node('98:14907'), node('98:14908')];
        const guides = [node('98:14909'), node('98:14923'), node('98:14914')];
        const next = node('98:14892');
        next.setAttribute('role', 'button');
        next.setAttribute('aria-disabled', 'true');
        next.tabIndex = -1;
        next.addEventListener('click', event => {
          if (next.getAttribute('aria-disabled') === 'true') {
            event.preventDefault(); event.stopImmediatePropagation();
          }
        }, true);
        const hotspot = document.createElement('button');
        hotspot.type = 'button';
        hotspot.className = 'shot-hotspot';
        hotspot.setAttribute('aria-label', '选择球场正面投篮点位');
        hotspot.setAttribute('aria-pressed', 'false');
        court.append(hotspot);
        let selected = false;
        hotspot.addEventListener('click', async () => {
          if (selected) return;
          selected = true;
          hotspot.setAttribute('aria-pressed', 'true');
          court.dataset.selectedPosition = 'front';
          if (window.parent !== window) {
            window.parent.postMessage({
              namespace:'qiuchiu-flow',
              type:'state',
              state:{spot:'罚球线区域',distance:'3–5m'}
            },'*');
          }
          const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
          dots.forEach(dot => { dot.style.visibility = 'visible'; });
          if (!reduced) await Promise.all(dots.map(dot => dot.animate([
            {opacity:0,transform:'scale(0.75)'}, {opacity:1,transform:'scale(1)'}
          ], {duration:180,easing:'cubic-bezier(0.2,0,0,1)'}).finished));
          guides.forEach(guide => {
            guide.style.visibility = 'visible';
            if (!reduced) guide.animate([
              {opacity:0},
              {opacity:Number(getComputedStyle(guide).opacity)}
            ], {duration:240,easing:'cubic-bezier(0.2,0,0,1)'});
          });
          next.setAttribute('aria-disabled', 'false');
          next.tabIndex = 0;
          next.style.cursor = 'pointer';
        });
        window.addEventListener('message', event => {
          if (window.parent !== window && event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.namespace !== 'qiuchiu-flow' || message.type !== 'hydrate') return;
          if (message.state && message.state.spot && !selected) hotspot.click();
        });
      })();
      (async () => {
        const message = document.querySelector('[data-node-id="98:14862"]');
        const card = document.querySelector('[data-node-id="98:14867"]');
        const fullText = message.textContent;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          message.style.visibility = card.style.visibility = 'visible';
          return;
        }
        message.setAttribute('aria-label', fullText);
        const text = document.createElement('span');
        text.setAttribute('aria-hidden', 'true');
        message.replaceChildren(text);
        message.style.visibility = 'visible';
        const characters = Array.from(fullText);
        const startAt = performance.now() + 80;
        await new Promise(resolve => {
          function tick(now) {
            const count = Math.min(characters.length, Math.max(0,
              Math.floor((now - startAt) / 50) + 1));
            text.textContent = characters.slice(0, count).join('');
            if (count < characters.length) requestAnimationFrame(tick);
            else resolve();
          }
          requestAnimationFrame(tick);
        });
        await new Promise(resolve => setTimeout(resolve, 100));
        card.style.visibility = 'visible';
        await card.animate([
          {transform:'translateY(48px)',opacity:0,offset:0},
          {transform:'translateY(-3px)',opacity:1,offset:0.78},
          {transform:'translateY(0)',opacity:1,offset:1}
        ], {duration:380,easing:'cubic-bezier(0.2,0,0,1)'}).finished;
      })();
      (function () {
        var DESIGN_W = 402;
        var DESIGN_H = 874;
        var stage = document.getElementById("rawStage");
        var frame = document.getElementById("rawStageFrame");
        function applyScale() {
          var viewportW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var fillViewport = DESIGN_W >= 960;
          var k = fillViewport ? viewportW / DESIGN_W : Math.min((viewportW - 32) / DESIGN_W, 1);
          if (!(k > 0)) { k = 1; }
          stage.style.transform = "scale(" + k + ")";
          frame.style.width = DESIGN_W * k + "px";
          frame.style.height = DESIGN_H * k + "px";
        }
        window.addEventListener("resize", applyScale);
        applyScale();
      })();
    </script>
