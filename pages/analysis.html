<html lang="zh-CN">

    <title>分析-1</title>
    <style>
      .issue-details { position:absolute;top:61px;left:16px;right:16px;padding:8px 0 20px;font:15px/1.5 'PingFang SC',sans-serif;cursor:pointer; }
      .issue-details h3 { font-size:15px;font-weight:500;margin:0 0 4px; }
      .issue-details p { margin:0 0 12px; }
      .issue-details ul { margin:0 0 12px;padding-left:18px; }
      .issue-details .plan-add { border:0;background:none;padding:0;color:#ff6d5b;font:inherit;cursor:pointer; }
      html {
        margin: 0;
        width: 100%;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100%;
        min-width: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: #fff;
        font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      }
      .raw-stage-frame {
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        background: #fff;
      }
      .raw-stage {
        position: relative;
        width: 402px;
        height: 874px;
        transform-origin: top left;
      }
      img {
        display: block;
      }
      .pose-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        filter: drop-shadow(0 0 2px rgba(255,104,116,.7)) drop-shadow(0 0 5px rgba(196,111,210,.28));
      }
      .pose-overlay .pose-bone {
        fill: none;
        stroke: url(#poseGradient);
        stroke-width: 1.55;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .pose-overlay .pose-joint {
        fill: rgba(255,255,255,.96);
        stroke: url(#poseGradient);
        stroke-width: 1.7;
        vector-effect: non-scaling-stroke;
        transform-box: fill-box;
        transform-origin: center;
      }
      #video-controls {
        z-index: 3;
      }
      .ai-pose-toggle {
        position: relative;
        cursor: pointer;
        transition: opacity 180ms ease-out;
      }
      .ai-pose-toggle .ai-original-icon,
      .ai-pose-toggle .ai-gradient-icon {
        transition: opacity 180ms ease-out;
      }
      .ai-pose-toggle .ai-original-icon { opacity: 1; }
      .ai-pose-toggle .ai-gradient-icon {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 15.91px;
        height: 12.16px;
        transform: translate(-50%,-50%);
        overflow: visible;
        opacity: 0;
        pointer-events: none;
      }
      .ai-pose-toggle.is-active .ai-original-icon { opacity: 0; }
      .ai-pose-toggle.is-active .ai-gradient-icon { opacity: 1; }
      .conversation-history {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        width: 386px;
        height: 36px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .conversation-history-list {
        position: relative;
        width: 278px;
        height: 36px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .conversation-history-row {
        position: absolute;
        left: 0;
        bottom: var(--history-offset,0px);
        display: flex;
        align-items: center;
        width: 278px;
        height: 36px;
        padding-left: 0;
        box-sizing: border-box;
        transition: padding-left 200ms cubic-bezier(.2,0,0,1);
      }
      .conversation-history.is-expanded .conversation-history-row {
        padding-left: 28px;
      }
      .conversation-history-dot {
        position: absolute;
        left: 6px;
        top: 16px;
        width: 4px;
        height: 4px;
        background: rgba(0,0,0,.3);
        border-radius: 50%;
        opacity: 0;
        transition: opacity 140ms ease-out;
      }
      .conversation-history.is-expanded .conversation-history-dot {
        opacity: 1;
      }
      .conversation-history-row.is-current .conversation-history-dot {
        background: rgba(0,0,0,.9);
      }
      .conversation-history-connector {
        position: absolute;
        left: 7.75px;
        top: -29px;
        width: .5px;
        height: 37px;
        background: rgba(0,0,0,.18);
        border-radius: 4px;
        opacity: 0;
      }
      .conversation-history-pill {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        max-width: 236px;
        height: 36px;
        padding: 6px 12px;
        box-sizing: border-box;
        appearance: none;
        overflow: hidden;
        color: rgba(0,0,0,.55);
        background: #fff;
        border: .5px solid rgba(0,0,0,.1);
        border-radius: 44px;
        font: 15px/23px 'PingFang SC',sans-serif;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .conversation-history-pill.is-clickable {
        cursor: pointer;
        transition: background-color 120ms ease-out, transform 120ms ease-out;
      }
      .conversation-history-pill.is-clickable:active {
        background: #f7f4f8;
        transform: scale(.985);
      }
      .conversation-history-entry-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .conversation-history-entry-arrow,
      .conversation-history-arrow {
        display: inline-grid;
        place-items: center;
        flex-shrink: 0;
        width: 12px;
        height: 24px;
      }
      .conversation-history-entry-arrow {
        color: rgba(0,0,0,.55);
      }
      .conversation-history-entry-arrow .conversation-history-arrow-icon {
        opacity: .6111;
      }
      .conversation-history-arrow-icon {
        display: block;
        width: 7.13px;
        height: 12.97px;
        transform: rotate(180deg);
      }
      .conversation-history-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 64px;
        height: 24px;
        margin: 0 10px 6px 0;
        padding: 2px 8px;
        color: rgba(0,0,0,.82);
        background: rgba(0,0,0,.035);
        border: 0;
        border-radius: 44px;
        font: 12px/18px 'PingFang SC',sans-serif;
        white-space: nowrap;
        cursor: pointer;
      }
      .conversation-history-arrow {
        color: rgba(0,0,0,.5);
        transform-origin: 50% 50%;
      }
      .conversation-history-arrow .conversation-history-arrow-icon {
        width: 5.13px;
        height: 10.97px;
        opacity: .5556;
      }
      @media (prefers-reduced-motion: reduce) {
        .ai-pose-toggle,
        .ai-pose-toggle .ai-original-icon,
        .ai-pose-toggle .ai-gradient-icon,
        .conversation-history-row,
        .conversation-history-dot { transition: none; }
      }
    </style>

            const scale = controls.getBoundingClientRect().width / controls.offsetWidth;

            const pointX = (markerRect.left + markerRect.width / 2 - controls.getBoundingClientRect().left) / scale;
            const bubbleWidth = bubbleBody.offsetWidth;
            const bubbleLeft = Math.max(8, Math.min(pointX - bubbleWidth / 2, controls.offsetWidth - bubbleWidth - 8));

            arrow.style.position = 'absolute';
            arrow.style.top = '33px';
            arrow.style.left = `${pointX - bubbleLeft - 4}px`;
            bubble.style.visibility = 'visible';
            clearTimeout(bubbleTimer);
            bubble.style.pointerEvents = 'auto';
            bubble.getAnimations().forEach(a => a.cancel());
            bubble.animate([{opacity:0},{opacity:1}], {duration:matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180});

              bubble.style.pointerEvents = 'none';
              const fade = bubble.animate([{opacity:1},{opacity:0}], {
                duration:matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180

              fade.onfinish = () => { bubble.style.visibility = 'hidden'; };
            }, 2000);
          });

          function syncSend() { send.style.opacity = text.innerText.trim() ? '1' : '.25'; send.setAttribute('aria-disabled',String(!text.innerText.trim())); }
          text.addEventListener('input',syncSend); syncSend();
          function openSavedConversation(entry) {
            if (!entry || sent || closing) return;
            sent = true; text.blur();
            historyMotions.forEach(motion=>motion.cancel()); historyMotions = [];
            const chat = document.getElementById('chat-template').content.firstElementChild.cloneNode(true);
            chat.id = 'ai-chat-sheet';
            Object.assign(chat.style,{top:'auto',bottom:'0',overflow:'hidden',borderRadius:'32px 32px 0 0'});
            const node = id => chat.querySelector('[data-node-id="'+id+'"]');
            node('85:13514').style.rowGap = '0';
            Object.assign(node('85:13291').style,{position:'absolute',bottom:'0',left:'0'});
            const viewport = node('86:13578');
            viewport.style.overflowY = 'auto';
            viewport.style.height = '570px';
            ['85:13540','85:13531','85:13523','85:13524','85:13532','85:13535','85:13536','86:13562','86:13561','86:13563','86:13565','86:13567','86:13569'].forEach(id=>node(id).style.height='auto');
            Object.assign(node('85:13523').style,{width:'auto',maxWidth:'334px',minWidth:'216px'});
            ['85:13524','85:13532'].forEach(id=>node(id).style.width='auto');
            node('85:13532').style.lineHeight = '1.5';
            node('85:13524').textContent = '来自' + entry.label;
            node('85:13532').textContent = entry.question;
            const answer = node('85:13536');
            answer.replaceChildren();
            answer.style.width = '386px';
            answer.style.minWidth = '0';
            answer.style.alignSelf = 'flex-start';
            answer.style.gap = '16px';
            const fallbackIndex = contextLabels.indexOf(entry.label);
            const chosen = Number.isInteger(entry.shotIndex) && entry.shotIndex >= 0 ? entry.shotIndex : Math.max(0,fallbackIndex);
            const titles = ['“上肢发力不均”是什么意思？','“出手点偏低”是什么意思？','“手腕跟随不足”是什么意思？','“身体前倾”是什么意思？'];
            const savedSections = [
              [titles[chosen],examples[chosen][0]],
              ['可以怎么练习？','1. ' + examples[chosen][1] + '\n2. ' + examples[chosen][2]],
              ['怎么判断有没有改善？','用同一角度记录几次练习，对比动作是否更连贯、出手是否更稳定。需要我帮你整理一个针对这个问题的练习计划吗？']
            ];
            savedSections.forEach(([title,body])=>{
              const section = document.createElement('div');
              section.className = 'ai-answer-section';
              section.style.cssText = 'display:flex;flex-direction:column;gap:6px;width:100%';
              const heading = document.createElement('div');
              heading.style.cssText = 'font:500 16px/1.6 "PingFang SC",sans-serif;color:#000';
              heading.textContent = title;
              const paragraph = document.createElement('div');
              paragraph.style.cssText = 'font:16px/1.6 "PingFang SC",sans-serif;color:#000;white-space:pre-wrap;overflow-wrap:anywhere';
              paragraph.textContent = body;
              section.append(heading,paragraph); answer.append(section);
            });
            overlay.append(chat); activeSheet = chat;
            overlay.setAttribute('aria-label','球球 AI 历史对话');
            sheet.getAnimations({subtree:true}).forEach(animation=>animation.cancel());
            sheet.animate([{transform:'translateY(0)'},{transform:'translateY('+sheet.offsetHeight+'px)'}],{
              duration:reduced?0:240,
              easing:'cubic-bezier(.3,0,1,1)',
              fill:'forwards'
            }).finished.then(()=>sheet.remove());
            chat.animate([
              {transform:'translateY(758px)'},
              {transform:'translateY(210px)',offset:.5},
              {transform:'translateY(0)'}
            ],{
              duration:reduced?0:420,
              delay:reduced?0:60,
              easing:'cubic-bezier(.2,0,0,1)',
              fill:'backwards'
            });
            node('85:13531').animate([{opacity:0},{opacity:1}],{duration:reduced?0:180,delay:reduced?0:290,fill:'backwards'});
            const back = node('85:13508');
            back.setAttribute('role','button'); back.setAttribute('aria-label','关闭历史对话'); back.tabIndex=0; back.style.cursor='pointer';
            back.addEventListener('click',close);
            back.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();close();}});
            back.focus({preventScroll:true});
            requestAnimationFrame(()=>{viewport.scrollTop=0;});
          }
          function submit() {
            const question = text.innerText.trim();
            if (!question || sent || closing) return;
            sent = true; text.blur();
            conversationHistory.push({label:currentLabel,question,shotIndex:index,createdAt:Date.now()});
            const chat = document.getElementById('chat-template').content.firstElementChild.cloneNode(true);
            chat.id = 'ai-chat-sheet';
            Object.assign(chat.style,{top:'auto',bottom:'0',overflow:'hidden',borderRadius:'32px 32px 0 0'});
            const node = id => chat.querySelector('[data-node-id="'+id+'"]');
            node('85:13514').style.rowGap = '0';
            Object.assign(node('85:13291').style,{position:'absolute',bottom:'0',left:'0'});
            node('86:13578').style.overflowY = 'auto';
            node('86:13578').style.height = '570px';
            ['85:13540','85:13531','85:13523','85:13524','85:13532','85:13535','85:13536','86:13562','86:13561','86:13563','86:13565','86:13567','86:13569'].forEach(id=>node(id).style.height='auto');
            Object.assign(node('85:13523').style,{width:'auto',maxWidth:'334px',minWidth:'216px'});
            ['85:13524','85:13532'].forEach(id=>node(id).style.width='auto');
            node('85:13532').style.lineHeight = '1.5';
            node('85:13524').textContent = context.textContent.replace('当前：','来自');
            node('85:13532').textContent = question;
            const answer = node('85:13536');
            const blocks = Array.from(answer.children);
            blocks.forEach(el=>el.remove());
            const thinking = document.createElement('div');
            thinking.style.cssText='display:flex;align-items:center;gap:8px;min-height:26px;font:16px/1.6 "PingFang SC",sans-serif;white-space:nowrap;color:rgba(0,0,0,.62)';
            const sparkle = document.createElement('span');
            sparkle.textContent = '✦';
            sparkle.style.cssText='display:inline-block;font-size:22px;line-height:1;background:linear-gradient(135deg,#ff655d 0%,#ef6f9f 55%,#ad82ef 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform-origin:50% 50%';
            const thoughtText = document.createElement('span');
            thinking.append(sparkle,thoughtText);
            answer.append(thinking); answer.style.width='58px'; answer.style.minWidth='58px'; answer.style.alignSelf='flex-start';
            answer.style.transition=reduced?'none':'width 100ms cubic-bezier(.25,.1,.25,1)';
            let sparkleMotion;
            const startSparkle = () => {
              sparkle.textContent='✦';
              sparkleMotion=sparkle.animate([
                {transform:'scale(.82) rotate(0deg)',opacity:.72,offset:0},
                {transform:'scale(1.08) rotate(120deg)',opacity:1,offset:.5},
                {transform:'scale(.82) rotate(0deg)',opacity:.72,offset:1}
              ],{duration:1600,iterations:Infinity,easing:'ease-in-out'});
            };
            overlay.append(chat); activeSheet = chat;
            startSparkle();
            overlay.setAttribute('aria-label','球球 AI 对话');
            sheet.getAnimations({subtree:true}).forEach(a=>a.cancel());
            sheet.animate([{transform:'translateY(0)'},{transform:'translateY('+sheet.offsetHeight+'px)'}],{duration:reduced?0:250,easing:'cubic-bezier(.3,0,1,1)',fill:'forwards'}).finished.then(()=>sheet.remove());
            chat.animate([{transform:'translateY(758px)'},{transform:'translateY(230px)',offset:.5},{transform:'translateY(0)'}],{duration:reduced?0:450,delay:reduced?0:90,easing:'cubic-bezier(.2,0,0,1)',fill:'backwards'});
            node('85:13531').animate([{opacity:0},{opacity:1}],{duration:reduced?0:200,delay:reduced?0:350,fill:'backwards'});
            const back = node('85:13508');
            back.setAttribute('role','button'); back.setAttribute('aria-label','关闭对话'); back.tabIndex=0; back.style.cursor='pointer';
            back.addEventListener('click',close);
            back.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();close();}});
            back.focus({preventScroll:true});
            const viewport = node('86:13578');
            let scrollFrame=0;
            const keepLatestVisible = () => {
              if(scrollFrame)return;
              scrollFrame=requestAnimationFrame(()=>{viewport.scrollTop=viewport.scrollHeight;scrollFrame=0;});
            };
            function streamInto(target,value,speed,done) {
              if(reduced){target.textContent=value;if(done)later(done,0);return;}
              const chars = Array.from(value); let cursor=0;
              const stable=document.createTextNode('');
              const tail=document.createElement('span');
              tail.style.opacity='.28';
              target.replaceChildren(stable,tail);
              const next = () => {
                if (closing || !chat.isConnected) return;
                if (cursor >= chars.length) { later(()=>{stable.data=value;tail.remove();if(done)done();},100); return; }
                cursor++;
                const committed=Math.max(0,cursor-2);
                stable.data=chars.slice(0,committed).join('');
                tail.textContent=chars.slice(committed,cursor).join('');
                keepLatestVisible(); later(next,speed);
              };
              next();
            }
            function streamStatus(value,done) {
              const chars=Array.from(value); let cursor=0;
              const measureContext=document.createElement('canvas').getContext('2d');
              measureContext.font=getComputedStyle(thoughtText).font;
              const prepareNext=()=>{
                if(closing||!chat.isConnected)return;
                if(cursor>=chars.length){if(done)later(done,0);return;}
                // The bubble makes room first; the next glyph only enters after it is safely enclosed.
                const bubbleRect=answer.getBoundingClientRect();
                const leftPadding=sparkle.getBoundingClientRect().left-bubbleRect.left;
                const textOffset=thoughtText.getBoundingClientRect().left-bubbleRect.left;
                const nextText=chars.slice(0,cursor+1).join('');
                const exactWidth=Math.ceil(textOffset+measureContext.measureText(nextText).width+leftPadding);
                answer.style.width=Math.min(330,Math.max(58,exactWidth))+'px';
                later(()=>{
                  if(closing||!chat.isConnected)return;
                  const glyph=document.createElement('span'); glyph.textContent=chars[cursor++]; thoughtText.append(glyph);
                  glyph.animate([{opacity:.12},{opacity:1}],{duration:reduced?0:150,easing:'ease-out'});
                  later(prepareNext,18);
                },105);
              };
              prepareNext();
            }
            const statuses = [
              {text:'构思中',hold:1150},
              {text:'回看本次投篮',hold:850},
              {text:'总结训练建议',hold:3000}
            ];
            function finishStatus(position) {
              if (closing || !chat.isConnected) return;
              if(position===statuses.length-1){ beginStreamingAnswer(); return; }
              thoughtText.style.opacity='0';
              later(()=>{
                thoughtText.textContent=''; answer.style.width='58px';
                later(()=>{
                  thoughtText.style.opacity='1'; showStatus(position+1);
                },190);
              },130);
            }
            function showStatus(position) {
              if (closing || !chat.isConnected) return;
              if (position >= statuses.length) { beginStreamingAnswer(); return; }
              thoughtText.textContent=''; thoughtText.style.opacity='1';
              streamStatus(statuses[position].text,()=>later(()=>finishStatus(position),statuses[position].hold));
            }
            function addSection(title,body,onDone) {
              if (closing || !chat.isConnected) return;
              const section=document.createElement('div');
              section.className='ai-answer-section';
              section.style.cssText='display:flex;flex-direction:column;gap:6px;width:100%';
              const heading=document.createElement('div');
              heading.style.cssText='font:500 16px/1.6 "PingFang SC",sans-serif;color:#000';
              const paragraph=document.createElement('div');
              paragraph.style.cssText='font:16px/1.6 "PingFang SC",sans-serif;color:#000;white-space:pre-wrap;overflow-wrap:anywhere';
              section.append(heading,paragraph); answer.append(section);
              section.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:reduced?0:180,easing:'ease-out'});
              keepLatestVisible();
              const growAnswerTo = width => {
                const current=parseFloat(answer.style.width)||answer.getBoundingClientRect().width;
                answer.style.width=Math.max(current,width)+'px';
              };
              growAnswerTo(Math.min(386,58+title.length*15));
              later(()=>streamInto(heading,title,32,()=>{
                growAnswerTo(386);
                later(()=>streamInto(paragraph,body,22,onDone),150);
              }),190);
            }
            function beginStreamingAnswer() {
              if (closing || !chat.isConnected) return;
              sparkleMotion.cancel(); thoughtText.style.opacity='0'; thoughtText.textContent=''; sparkle.style.opacity='0'; answer.style.width='58px';
              const chosen=Math.max(0,index);
              const titles=['“上肢发力不均”是什么意思？','“出手点偏低”是什么意思？','“手腕跟随不足”是什么意思？','“身体前倾”是什么意思？'];
              later(()=>{thinking.remove();answer.style.minWidth='0';answer.style.alignSelf='flex-start';answer.style.gap='16px';addSection(titles[chosen],examples[chosen][0],()=>later(()=>
                addSection('可以怎么练习？','1. '+examples[chosen][1]+'\n2. '+examples[chosen][2],()=>later(()=>
                  addSection('怎么判断有没有改善？','用同一角度记录几次练习，对比动作是否更连贯、出手是否更稳定。需要我帮你整理一个针对这个问题的练习计划吗？'),260)
              ),260));},180);
            }
            later(()=>showStatus(0),650);
          }
          send.addEventListener('click',submit);
          send.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();submit();}});
          text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}});
          async function close() {
            if (closing) return; closing = true;
            replyTimers.forEach(clearTimeout); replyTimers.clear();
            activeSheet.getAnimations({subtree:true}).forEach(a=>a.cancel());
            await activeSheet.animate([{transform:'translateY(0)'},{transform:'translateY('+activeSheet.offsetHeight+'px)'}],{duration:reduced?0:240,easing:'ease-in',fill:'forwards'}).finished;
            overlay.remove(); composerOpen = false; inputTrigger.focus({preventScroll:true});
          }
          shade.addEventListener('click',close);
          overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();}});
        }
        inputTrigger.addEventListener('click',openComposer);
        inputTrigger.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openComposer();}});
        let closeActiveCard = null;
        Array.from(issueList.children).forEach((card,index) => {
          const [analysis,first,second] = examples[index];
          const panel = document.createElement('div');
          panel.className = 'issue-details';
          panel.id = `issue-detail-${index}`;
          panel.innerHTML = `<h3>问题分析</h3><p>${analysis}</p><h3>优化建议</h3><ul><li>${first}</li><li>${second}</li></ul><button type="button" class="plan-add">＋ 加入训练计划</button>`;
          panel.hidden = true;
          card.append(panel);
          card.style.overflow = 'hidden';
          card.style.cursor = 'pointer';
          card.tabIndex = 0;
          card.setAttribute('aria-expanded','false');
          card.setAttribute('aria-controls',panel.id);
          let open = false, motion;
          function expand() {
            if (!open && closeActiveCard && closeActiveCard !== expand) closeActiveCard();
            const from = card.getBoundingClientRect().height / (document.getElementById('rawStage').getBoundingClientRect().width / 402);
            if (motion) motion.cancel();
            open = !open;
            closeActiveCard = open ? expand : null;
            clearTimeout(questionTimer);
            ++questionVersion;
            questionInput.getAnimations().forEach(a => a.cancel());
            panel.hidden = false;
            panel.inert = !open;
            const to = open ? 61 + panel.offsetHeight : 61;
            card.setAttribute('aria-expanded',String(open));
            card.style.height = `${to}px`;
            motion = card.animate([{height:`${from}px`},{height:`${to}px`}], {
              duration:matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : open ? 300 : 220,
              easing:'cubic-bezier(0.2,0,0,1)'
            });
            motion.onfinish = () => {
              if (!open) { panel.hidden = true; if (!closeActiveCard) suggestQuestion(null); }
              else questionTimer = setTimeout(() => suggestQuestion(index),120);
            };
          }
          card.addEventListener('click',expand);
          card.addEventListener('keydown',event=>{
            if(event.target===card && (event.key==='Enter'||event.key===' ')){event.preventDefault();expand();}
          });
          const add = panel.querySelector('button');
          const plan = planDefinitions[index];
          planButtons.set(plan.id,add);
          syncPlanButtons();
          add.addEventListener('click',event=>{
            event.stopPropagation();
            if (selectedPlans.has(plan.id)) selectedPlans.delete(plan.id);
            else selectedPlans.set(plan.id,plan);
            syncPlanButtons();
            publishPlans();
          });
        });
      })();
      (function () {
        var DESIGN_W = 402;
        var DESIGN_H = 874;
        var stage = document.getElementById("rawStage");
        var frame = document.getElementById("rawStageFrame");
        function applyScale() {
          var viewportW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var fillViewport = DESIGN_W >= 960;
          var k = fillViewport ? viewportW / DESIGN_W : Math.min((viewportW - 32) / DESIGN_W, 1);
          if (!(k > 0)) { k = 1; }
          stage.style.transform = "scale(" + k + ")";
          frame.style.width = DESIGN_W * k + "px";
          frame.style.height = DESIGN_H * k + "px";
        }
        window.addEventListener("resize", applyScale);
        applyScale();
      })();
    </script>
