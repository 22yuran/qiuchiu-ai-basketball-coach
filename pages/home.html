    <script>
      // Keep the original bitmap; a tiny SVG eyelid layer animates only the eyes.
      const mascotImage = document.querySelector('[data-node-id="174:8618"]');
      if (mascotImage) {
        const mascot = document.createElement('span');
        mascot.className = 'mascot-motion';
        const body = document.createElement('span');
        body.className = 'mascot-body';
        body.style.display = 'block';
        mascotImage.before(mascot);
        mascot.append(body);
        body.append(mascotImage);
        body.insertAdjacentHTML('beforeend', `<svg class="mascot-eyelids" viewBox="0 0 1254 1254" aria-hidden="true">
          <defs>
            <linearGradient id="mascot-lid-left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa8895"/><stop offset="1" stop-color="#fa828d"/></linearGradient>
            <linearGradient id="mascot-lid-right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb979c"/><stop offset="1" stop-color="#fa9297"/></linearGradient>
          </defs>
          <rect x="471" y="479" width="72" height="149" rx="35" fill="url(#mascot-lid-left)"/>
          <rect x="710" y="476" width="72" height="149" rx="35" fill="url(#mascot-lid-right)"/>
          <rect class="mascot-eye" x="475" y="484" width="64" height="140" rx="32" fill="#fff"/>
          <rect class="mascot-eye" x="714" y="481" width="64" height="140" rx="32" fill="#fff"/>
        </svg>`);
        document.addEventListener('visibilitychange',()=>{
          mascot.getAnimations({subtree:true}).forEach(animation=>document.hidden?animation.pause():animation.play());
        });
      }
      const exportedBrand = document.querySelector('[data-node-id="174:8620"]');
      if (exportedBrand) {
        const brandText = document.createElement('div');
        brandText.className = 'home-brand-title';
        brandText.dataset.nodeId = '174:8620';
        brandText.dataset.name = 'Title';
        brandText.textContent = '球球来啦～';
        exportedBrand.replaceWith(brandText);
      }

      const weeklyChart = document.querySelector('[data-node-id="174:8685"]');
      if (weeklyChart) {
        weeklyChart.src = './home-weekly-chart@3x.png';
        weeklyChart.decoding = 'async';
      }

      const planList = document.querySelector('[data-node-id="174:8664"]');
      const planRowTemplate = planList && planList.firstElementChild
        ? planList.firstElementChild.cloneNode(true)
        : null;

      function renderPlans(plans) {
        if (!planList || !planRowTemplate) return;
        const safePlans = Array.isArray(plans)
          ? plans.filter(plan => plan && typeof plan.title === 'string')
          : [];
        planList.replaceChildren();
        if (!safePlans.length) {
          const empty = document.createElement('div');
          empty.className = 'home-plan-empty';
          empty.textContent = '暂无计划';
          planList.append(empty);
          planList.scrollTop = 0;
          return;
        }
        safePlans.forEach(plan => {
          const row = planRowTemplate.cloneNode(true);
          const title = row.querySelector('[data-node-id="174:8668"]');
          if (title) {
            title.classList.add('home-plan-title');
            title.textContent = plan.title;
            title.title = plan.title;
          }
          planList.append(row);
        });
        planList.scrollTop = Math.max(0, planList.scrollHeight - planList.clientHeight);
      }

      renderPlans([]);
      window.addEventListener('message', event => {
        const message = event.data;
        if (!message || message.namespace !== 'qiuchiu-flow' || message.type !== 'hydrate') return;
        renderPlans(message.state && message.state.plans);
      });

      const analyzeButton = document.querySelector('[data-node-id="174:8640"]');
      if (analyzeButton) {
        analyzeButton.setAttribute('role', 'link');
        analyzeButton.setAttribute('tabindex', '0');
        analyzeButton.style.cursor = 'pointer';
        const openCollection = () => {
          if (window.parent !== window) {
            window.parent.postMessage({namespace: 'qiuchiu-flow', type: 'navigate', target: 'intro'}, '*');
          } else {
            window.location.href = './collect-intro.html';
          }
        };
        analyzeButton.addEventListener('click', openCollection);
        analyzeButton.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openCollection();
          }
        });
      }

      (function () {
        var DESIGN_W = 402;
        var DESIGN_H = 874;
        var stage = document.getElementById("rawStage");
        var frame = document.getElementById("rawStageFrame");
        function applyScale() {
          var viewportW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var fillViewport = DESIGN_W >= 960;
          var k = fillViewport ? viewportW / DESIGN_W : Math.min((viewportW - 32) / DESIGN_W, 1);
          if (!(k > 0)) { k = 1; }
          stage.style.transform = "scale(" + k + ")";
          frame.style.width = DESIGN_W * k + "px";
          frame.style.height = DESIGN_H * k + "px";
        }
        window.addEventListener("resize", applyScale);
        applyScale();
      })();
    </script>
