    <script>
      const uploadButton = document.querySelector('[data-node-id="99:15045"]');
      uploadButton.setAttribute('role','link');
      uploadButton.tabIndex = 0;
      uploadButton.style.cursor = 'pointer';
      const openAnalysis = () => {
        if (window.parent !== window) {
          window.parent.postMessage({namespace:'qiuchiu-flow',type:'navigate',target:'loading'},'*');
        } else {
          location.href = './loading.html';
        }
      };
      uploadButton.addEventListener('click',openAnalysis);
      uploadButton.addEventListener('keydown',event => { if(event.key === 'Enter') openAnalysis(); });
      window.addEventListener('message',event => {
        if (window.parent !== window && event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.namespace !== 'qiuchiu-flow' || message.type !== 'hydrate') return;
        const state = message.state || {};
        const values = {
          '99:15140':state.hand,
          '99:15145':state.venue,
          '99:15150':state.spot,
          '99:15155':state.distance
        };
        Object.entries(values).forEach(([id,value]) => {
          if (value) document.querySelector('[data-node-id="'+id+'"]').textContent = value;
        });
      });
      (async () => {
        const node = id => document.querySelector(`[data-node-id="${id}"]`);
        const message = node('99:15015');
        const layers = [node('99:15156'), node('99:15133')];
        const actions = node('99:15044');
        const fullText = message.textContent;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          [message, ...layers, actions].forEach(el => el.style.visibility = 'visible');
          return;
        }
        message.setAttribute('aria-label', fullText);
        const text = document.createElement('span');
        text.setAttribute('aria-hidden', 'true');
        message.replaceChildren(text);
        message.style.visibility = 'visible';
        const characters = Array.from(fullText);
        const startAt = performance.now() + 80;
        await new Promise(resolve => {
          function tick(now) {
            const count = Math.min(characters.length, Math.max(0,
              Math.floor((now - startAt) / 50) + 1));
            text.textContent = characters.slice(0, count).join('');
            if (count < characters.length) requestAnimationFrame(tick);
            else resolve();
          }
          requestAnimationFrame(tick);
        });
        await new Promise(resolve => setTimeout(resolve, 100));
        // Background and content move together; original top/left remain intact.
        const entryDistance = document.getElementById('rawStage').offsetHeight - layers[0].offsetTop + 16;
        const cardAnimations = layers.map(layer => {
          layer.style.visibility = 'visible';
          return layer.animate([
            {transform:`translateY(${entryDistance}px)`,opacity:1,offset:0},
            {transform:'translateY(0)',opacity:1,offset:1}
          ], {duration:650,easing:'cubic-bezier(0.4,0,0.2,1)'}).finished;
        });
        // Begin the action fade 140ms before the card settles.
        await new Promise(resolve => setTimeout(resolve, 510));
        actions.style.visibility = 'visible';
        actions.animate([{opacity:0}, {opacity:1}],
          {duration:280,easing:'cubic-bezier(0.2,0,0,1)'});
        await Promise.all(cardAnimations);
      })();
      (function () {
        var DESIGN_W = 402;
        var DESIGN_H = 874;
        var stage = document.getElementById("rawStage");
        var frame = document.getElementById("rawStageFrame");
        function applyScale() {
          var viewportW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var fillViewport = DESIGN_W >= 960;
          var k = fillViewport ? viewportW / DESIGN_W : Math.min((viewportW - 32) / DESIGN_W, 1);
          if (!(k > 0)) { k = 1; }
          stage.style.transform = "scale(" + k + ")";
          frame.style.width = DESIGN_W * k + "px";
          frame.style.height = DESIGN_H * k + "px";
        }
        window.addEventListener("resize", applyScale);
        applyScale();
      })();
    </script>
