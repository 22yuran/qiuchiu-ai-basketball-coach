    <style>
      html {
        margin: 0;
        width: 100%;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100%;
        min-width: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: #fff;
        font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      }
      .raw-stage-frame {
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        background: #fff;
      }
      .raw-stage {
        position: relative;
        width: 402px;
        height: 874px;
        transform-origin: top left;
      }
      img {
        display: block;
      }
      .loading-skeleton {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        padding: 14px 18px !important;
        overflow: hidden;
      }
      .loading-placeholder-main {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
      }
      .loading-placeholder {
        display: block;
        width: 56px;
        height: 32px;
        flex: none;
        background: rgba(82,61,86,.08);
        border-radius: 6px;
        opacity: .28;
        animation: text-placeholder-breathe 2.8s cubic-bezier(.4,0,.2,1) infinite;
        animation-delay: calc(var(--delay, 0s) + var(--bar-delay, 0s));
      }
      .loading-placeholder.is-copy {
        width: auto;
        flex: 1;
        --bar-delay: .16s;
      }
      .loading-placeholder.is-value {
        width: 34px;
        height: 32px;
        --bar-delay: .32s;
      }
      @keyframes text-placeholder-breathe {
        0%, 100% { opacity: .20; }
        46% { opacity: .42; }
        68% { opacity: .30; }
      }
      .result-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .result-main { display:flex;align-items:center;gap:10px;min-width:0; }
      .result-badge { display:inline-flex;align-items:center;gap:5px;padding:7px 10px;color:#171717;background:#f5f1f6;border-radius:999px;font-size:15px;white-space:nowrap; }
      .result-play { display:grid;place-items:center;width:14px;height:14px;color:#fff;background:#b8aeba;border-radius:50%;font-size:8px;line-height:1; }
      .result-issue { overflow:hidden;color:#111;font-size:15px;font-weight:500;white-space:nowrap;text-overflow:ellipsis; }
      .result-score { display:flex;align-items:baseline;gap:5px;white-space:nowrap; }
      .result-score span { color:rgba(0,0,0,.45);font-size:12px; }
      .result-score b { color:#111;font-family:'SF Pro Display',-apple-system,sans-serif;font-size:22px; }
      @media (prefers-reduced-motion: reduce) {
        .loading-placeholder { animation: none; opacity: .30; }
      }
    </style>

          {shot:'投篮5',issue:'上肢发力不均匀',score:30},

          {shot:'投篮1',issue:'手腕跟随不足',score:51},
          {shot:'投篮2',issue:'身体前倾',score:60}
        ];
        var placeholderWidths = [118,96,126,104];
        cards.forEach(function(card,index){
          card.classList.add('loading-skeleton');
          card.setAttribute('aria-label','正在生成投篮分析');
          card.innerHTML='<div class="loading-placeholder-main" aria-hidden="true"><i class="loading-placeholder"></i><i class="loading-placeholder is-copy" style="--copy-width:'+placeholderWidths[index]+'px"></i></div><i class="loading-placeholder is-value" aria-hidden="true"></i>';
          card.style.setProperty('--delay',(index*.18)+'s');
        });
        percentage.textContent='0%';
        percentage.style.width='32px';
        progressGroup.style.width='113px';
        progressGroup.style.left='132.5px';
        var messageIndex=0;
        var messageTimer=setInterval(function(){
          var out=helper.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-5px)',opacity:0}],{duration:240,easing:'ease-in',fill:'forwards'});
          out.finished.then(function(){
            messageIndex=(messageIndex+1)%messages.length;
            helper.textContent=messages[messageIndex];
            helper.animate([{transform:'translateY(5px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:300,easing:'cubic-bezier(.2,0,0,1)',fill:'forwards'});
          }).catch(function(){});
        },2700);
        var loadingDone=false;
        function finishLoading(){
          if(loadingDone)return;
          loadingDone=true;
          clearInterval(messageTimer);
          percentage.textContent='100%';
          setTimeout(function(){
            [videoMask,helper,progressGroup].forEach(function(el){
              el.animate([{opacity:1},{opacity:0}],{duration:280,easing:'ease-out',fill:'forwards'}).finished.then(function(){el.style.display='none';}).catch(function(){});
            });
            cards.forEach(function(card,index){
              var item=results[index];
              card.classList.remove('loading-skeleton');
              card.classList.add('result-row');
              card.innerHTML='<div class="result-main"><span class="result-badge"><i class="result-play">▶</i>'+item.shot+'</span><strong class="result-issue">'+item.issue+'</strong></div><div class="result-score"><span>稳定度</span><b>'+item.score+'</b></div>';
            });
            setTimeout(function(){
              if (window.parent !== window) {
                window.parent.postMessage({namespace:'qiuchiu-flow',type:'navigate',target:'analysis'},'*');
              } else {
                location.href = './analysis.html';
              }
            },1100);
          },360);
        }
        window.__finishLoading=finishLoading;
        var loadingStarted=performance.now();
        var loadingDuration=9000;
        function updateLoading(now){
          if(loadingDone)return;
          var elapsed=Math.min(1,(now-loadingStarted)/loadingDuration);
          var eased=1-Math.pow(1-elapsed,1.22);
          percentage.textContent=Math.min(100,Math.floor(eased*100))+'%';
          if(elapsed<1)requestAnimationFrame(updateLoading);
          else finishLoading();
        }
        requestAnimationFrame(updateLoading);
        function applyScale() {
          var viewportW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var fillViewport = DESIGN_W >= 960;
          var k = fillViewport ? viewportW / DESIGN_W : Math.min((viewportW - 32) / DESIGN_W, 1);
          if (!(k > 0)) { k = 1; }
          stage.style.transform = "scale(" + k + ")";
          frame.style.width = DESIGN_W * k + "px";
          frame.style.height = DESIGN_H * k + "px";
        }
        window.addEventListener("resize", applyScale);
        applyScale();
      })();
    </script>
  </body>
</html>
