<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="description" content="球球 AI 篮球教练：从训练信息采集、投篮分析到 AI 问答与训练计划的完整交互原型。" />
    <meta name="theme-color" content="#f1edf2" />
    <meta property="og:title" content="球球 AI 篮球教练" />
    <meta property="og:description" content="一款可交互的 AI 投篮分析与训练计划原型。" />
    <meta property="og:image" content="https://22yuran.github.io/qiuchiu-ai-basketball-coach/media/preview-home-20260922.png" />
    <meta property="og:image:alt" content="球球最新首页 · iPhone 17 Pro 银色样机" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>球球 AI 篮球教练 · 完整流程</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        background: #f1edf2;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body { background: #f1edf2; }
      .desktop-canvas {
        position: relative;
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 24px 32px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 18% 17%, rgba(255,255,255,.96) 0, rgba(255,255,255,.58) 20%, transparent 45%),
          radial-gradient(circle at 84% 18%, rgba(255,226,222,.68) 0, rgba(255,226,222,.22) 23%, transparent 48%),
          radial-gradient(circle at 23% 88%, rgba(225,217,248,.74) 0, rgba(225,217,248,.18) 27%, transparent 51%),
          linear-gradient(145deg, #f7f4f7 0%, #eee8ee 52%, #f8f1f1 100%);
      }
      .desktop-canvas::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 2.5%;
        width: min(58vw, 760px);
        height: 70px;
        border-radius: 50%;
        background: rgba(59,42,62,.13);
        filter: blur(30px);
        transform: translateX(-50%);
        pointer-events: none;
      }
      .device-sizer {
        position: relative;
        z-index: 1;
        width: 426px;
        height: 898px;
        flex: none;
      }
      .iphone-device {
        position: absolute;
        top: 0;
        left: 0;
        width: 426px;
        height: 898px;
        transform-origin: top left;
        border: 1px solid rgba(255,255,255,.72);
        border-radius: 64px;
        background:
          linear-gradient(112deg, rgba(255,255,255,.48), transparent 13% 83%, rgba(255,255,255,.2)),
          linear-gradient(145deg, #f0f0ee 0%, #b7b8b7 15%, #e3e4e2 48%, #9b9d9c 79%, #e8e9e7 100%);
        box-shadow:
          0 52px 100px rgba(59,42,62,.20),
          0 18px 38px rgba(37,26,39,.18),
          inset 0 0 0 1px rgba(0,0,0,.55);
      }
      .iphone-device::before {
        content: "";
        position: absolute;
        inset: 5px;
        z-index: 3;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 59px;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.72);
        pointer-events: none;
      }
      .side-button {
        position: absolute;
        z-index: 1;
        width: 5px;
        background: linear-gradient(180deg, #dedfdd, #969997 48%, #e5e6e3);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.45);
      }
      .side-button.action {
        left: -4px;
        top: 154px;
        height: 38px;
        border-radius: 3px 0 0 3px;
      }
      .side-button.volume-up {
        left: -4px;
        top: 218px;
        height: 70px;
        border-radius: 3px 0 0 3px;
      }
      .side-button.volume-down {
        left: -4px;
        top: 302px;
        height: 70px;
        border-radius: 3px 0 0 3px;
      }
      .side-button.power {
        right: -4px;
        top: 248px;
        height: 102px;
        border-radius: 0 3px 3px 0;
      }
      .iphone-screen {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 2;
        width: 402px;
        height: 874px;
        overflow: hidden;
        border-radius: 52px;
        background: #fbf8fa;
        box-shadow: 0 0 0 1px rgba(0,0,0,.92);
      }
      .side-button.camera-control {
        right:-3px;
        top:548px;
        width:4px;
        height:58px;
        border-radius:0 3px 3px 0;
        background:linear-gradient(180deg,#c8cac7,#969a97,#d4d6d2);
      }
      #app {
        position: absolute;
        top: 0;
        left: -16px;
        width: 434px;
        height: 874px;
        overflow: hidden;
      }
      .flow-viewport {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .flow-viewport {
        position: relative;
        isolation: isolate;
      }
      .dynamic-island {
        position: absolute;
        top: 11px;
        left: 50%;
        z-index: 20;
        width: 126px;
        height: 37px;
        border-radius: 22px;
        background: #050506;
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,.035),
          0 1px 2px rgba(0,0,0,.18);
        transform: translateX(-50%);
        pointer-events: none;
      }
      .device-status-bar {
        position: absolute;
        top: 11px;
        left: 0;
        z-index: 19;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 402px;
        height: 37px;
        padding: 0 27px;
        color: rgba(0,0,0,.9);
        pointer-events: none;
      }
      .device-time {
        width: 54px;
        height: 21px;
        font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 17px;
        font-weight: 600;
        line-height: 22px;
        letter-spacing: -.41px;
        text-align: center;
        white-space: nowrap;
      }
      .device-status-icons {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 13px;
      }
      .device-signal {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        width: 18px;
        height: 12px;
      }
      .device-signal i {
        display: block;
        width: 3px;
        border-radius: 1px;
        background: rgba(0,0,0,.9);
      }
      .device-signal i:nth-child(1) { height: 4px; }
      .device-signal i:nth-child(2) { height: 7px; }
      .device-signal i:nth-child(3) { height: 10px; }
      .device-signal i:nth-child(4) { height: 12px; }
      .device-wifi {
        width: 17px;
        height: 12px;
        overflow: visible;
      }
      .device-battery {
        position: relative;
        width: 27px;
        height: 13px;
        border: 1px solid rgba(0,0,0,.35);
        border-radius: 4px;
      }
      .device-battery::before {
        content: "";
        position: absolute;
        inset: 1.5px 2px;
        border-radius: 2px;
        background: rgba(0,0,0,.9);
      }
      .device-battery::after {
        content: "";
        position: absolute;
        top: 4px;
        right: -3px;
        width: 2px;
        height: 5px;
        border-radius: 0 2px 2px 0;
        background: rgba(0,0,0,.35);
      }
      .dynamic-island::after {
        content: "";
        position: absolute;
        top: 14px;
        right: 16px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(circle at 36% 32%, #24486d 0 12%, #102238 25%, #05070a 58%, #000 100%);
        box-shadow: 0 0 2px rgba(54,105,153,.6);
        opacity: .72;
      }
      .flow-frame {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fbf8fa;
        opacity: 1;
        transform: translate3d(0,0,0) scale(1);
        transform-origin: 50% 50%;
        transition:
          opacity 300ms ease-out,
          transform 420ms cubic-bezier(.2,0,0,1);
      }
      .flow-frame.is-entering {
        z-index: 2;
        opacity: 0;
        transform: translate3d(0,18px,0) scale(.995);
        pointer-events: none;
      }
      .flow-frame.is-active {
        z-index: 2;
        opacity: 1;
        transform: translate3d(0,0,0) scale(1);
      }
      .flow-frame.is-leaving {
        z-index: 1;
        opacity: 0;
        transform: translate3d(0,-10px,0) scale(.995);
        pointer-events: none;
        transition-timing-function: cubic-bezier(.3,0,1,1);
        transition-duration: 240ms;
      }
      .sr-only {
        position: fixed;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-frame { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="desktop-canvas">
      <div class="device-sizer" id="deviceSizer">
        <div class="iphone-device" id="iphoneDevice" aria-label="iPhone 17 Pro 银色演示样机">
          <i class="side-button action" aria-hidden="true"></i>
          <i class="side-button volume-up" aria-hidden="true"></i>
          <i class="side-button volume-down" aria-hidden="true"></i>
          <i class="side-button power" aria-hidden="true"></i>
          <i class="side-button camera-control" aria-hidden="true"></i>
          <div class="iphone-screen">
            <main id="app" aria-label="球球 AI 篮球教练完整体验">
              <div class="flow-viewport" id="flowViewport"></div>
              <p class="sr-only" id="flowStatus" aria-live="polite"></p>
            </main>
            <div class="device-status-bar" aria-hidden="true">
              <span class="device-time">9:41</span>
              <span class="device-status-icons">
                <span class="device-signal"><i></i><i></i><i></i><i></i></span>
                <svg class="device-wifi" viewBox="0 0 17 12" aria-hidden="true">
                  <path d="M1.1 3.8C5.2-.1 11.8-.1 15.9 3.8M3.7 6.5a7.1 7.1 0 0 1 9.6 0M6.2 9a3.5 3.5 0 0 1 4.6 0M8.5 11h.01" fill="none" stroke="rgba(0,0,0,.9)" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span class="device-battery"></span>
              </span>
            </div>
            <div class="dynamic-island" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const DEVICE_W = 426;
        const DEVICE_H = 898;
        const device = document.getElementById('iphoneDevice');
        const deviceSizer = document.getElementById('deviceSizer');
        function fitDevice() {
          const viewportWidth = window.visualViewport?.width ?? window.innerWidth;
          const viewportHeight = window.visualViewport?.height ?? window.innerHeight;
          const availableWidth = Math.max(1, viewportWidth - 64);
          const availableHeight = Math.max(1, viewportHeight - 48);
          const scale = Math.min(1.08, availableWidth / DEVICE_W, availableHeight / DEVICE_H);
          device.style.transform = `scale(${scale})`;
          deviceSizer.style.width = `${DEVICE_W * scale}px`;
          deviceSizer.style.height = `${DEVICE_H * scale}px`;
        }
        addEventListener('resize', fitDevice);
        window.visualViewport?.addEventListener('resize', fitDevice);
        fitDevice();

        const routes = {
          home: {src:'pages/home.html', title:'首页'},
          intro: {src:'pages/collect-intro.html', title:'开始信息采集'},
          hand: {src:'pages/collect-hand.html', title:'选择惯用手'},
          court: {src:'pages/collect-court.html', title:'选择训练场地'},
          spot: {src:'pages/collect-spot.html', title:'选择投篮点位'},
          summary: {src:'pages/collect-summary.html', title:'确认训练信息'},
          loading: {src:'pages/loading.html', title:'视频解析中'},
          analysis: {src:'pages/analysis.html', title:'投篮分析'}
        };
        const viewport = document.getElementById('flowViewport');
        const status = document.getElementById('flowStatus');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let activeFrame = null;
        let currentRoute = null;
        let transitioning = false;
        let queuedRoute = null;
        let routeStack = [];
        const initialFlowState = {
          hand:'左手',
          venue:'NBA 标准场',
          spot:null,
          distance:null
        };
        const flowState = {...initialFlowState,plans:[]};

        function resetState() {
          const plans = Array.isArray(flowState.plans)
            ? flowState.plans.map(plan=>({...plan}))
            : [];
          Object.assign(flowState, initialFlowState, {plans});
        }

        function makeFrame(name) {
          const route = routes[name];
          const frame = document.createElement('iframe');
          frame.className = 'flow-frame is-entering';
          frame.title = route.title;
          frame.setAttribute('allow','autoplay');
          frame.src = route.src;
          return frame;
        }

        function finishTransition(nextFrame, name, previousFrame) {
          if (previousFrame) previousFrame.remove();
          nextFrame.classList.remove('is-entering');
          nextFrame.classList.add('is-active');
          activeFrame = nextFrame;
          currentRoute = name;
          transitioning = false;
          status.textContent = '已进入' + routes[name].title;
          if (queuedRoute && queuedRoute !== currentRoute) {
            const queued = queuedRoute;
            queuedRoute = null;
            navigate(queued);
          } else {
            queuedRoute = null;
          }
        }

        function navigate(name, options = {}) {
          if (!routes[name] || name === currentRoute) return;
          if (transitioning) {
            queuedRoute = name;
            return;
          }
          transitioning = true;
          if (currentRoute && !options.fromBack) routeStack.push(currentRoute);
          const previousFrame = activeFrame;
          const nextFrame = makeFrame(name);
          nextFrame.addEventListener('load', () => {
            nextFrame.contentWindow.postMessage({
              namespace:'qiuchiu-flow',
              type:'hydrate',
              state:{...flowState}
            },'*');
            if (!previousFrame || reduced) {
              finishTransition(nextFrame,name,previousFrame);
              return;
            }
            requestAnimationFrame(() => requestAnimationFrame(() => {
              previousFrame.classList.remove('is-active');
              previousFrame.classList.add('is-leaving');
              nextFrame.classList.remove('is-entering');
              nextFrame.classList.add('is-active');
              setTimeout(() => finishTransition(nextFrame,name,previousFrame),430);
            }));
          }, {once:true});
          // Register the load listener before insertion so local file:// pages
          // cannot finish loading before the transition handshake is attached.
          viewport.append(nextFrame);
        }

        function back() {
          const previous = routeStack.pop();
          if (previous) navigate(previous,{fromBack:true});
        }

        addEventListener('message', event => {
          if (!activeFrame || event.source !== activeFrame.contentWindow) return;
          const message = event.data;
          if (!message || message.namespace !== 'qiuchiu-flow') return;
          if (message.type === 'state' && message.state) {
            Object.assign(flowState,message.state);
          }
          if (message.type === 'navigate') navigate(message.target);
          if (message.type === 'back') back();
          if (message.type === 'restart') {
            routeStack = [];
            resetState();
            navigate('home',{fromBack:true});
          }
        });

        window.__qiuchiuFlow = {
          go:navigate,
          back,
          restart:() => {
            routeStack = [];
            resetState();
            navigate('home',{fromBack:true});
          },
          state:flowState,
          get current() { return currentRoute; }
        };
        navigate('home',{fromBack:true});
      })();
    </script>
  </body>
</html>
